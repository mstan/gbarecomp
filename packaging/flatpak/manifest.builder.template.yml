# manifest.builder.template.yml — Flatpak manifest for the BoktaiBuilder
# (the first-run compilation wizard, not the recompiled game).
#
# This manifest is generated by build_flatpak.sh and tools/package_builder_flatpak.sh.
# Do not edit the generated copy.
#
# Differences from manifest.template.yml (the game):
#   - Runtime must include the build toolchain (gcc, g++, CMake, Ninja), so we use
#     the full org.freedesktop.Sdk 25.08 as the runtime itself, not a base platform.
#   - Command is BoktaiBuilder, not the game executable.
#   - post-install stages the builder's window assets, not the game launcher's.
#   - The sources are bundled: the builder copies them to a writable temp location
#     (because CMake writes into the source tree during the build), then compiles
#     in that copy. The original /app/sources stays read-only.
#
# Why Flatpak + Sdk: SteamOS has an immutable root, so installing gcc, g++,
# CMake or Ninja is not possible. A Flatpak runtime provides all of that at
# execution time. The builder downloads the Sdk once (shared with other apps)
# and uses it at runtime while building the game.

id: '@APP_ID@'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-version: '25.08'
command: '@TARGET@'

finish-args:
  # Graphics + input. --device=all covers the Deck's own controller and any pad.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --share=ipc
  # Network is needed ONLY by games with a network-backed peripheral (Boktai's
  # solar sensor resolves a postal code to current irradiance). Remove this line
  # if the game has none — the builder and runtime work without it.
  - --share=network
  # The builder needs home access to read the player's ROM and BIOS files
  # (picked via file dialog), and to write the build output and logs into
  # the per-user data directory. Narrow this if you keep them in one place.
  - --filesystem=home
  # Per-user data directory for build artifacts and logs. Flatpak sandboxes
  # each app's XDG_DATA_HOME, so the game the builder produces can read its
  # own compiled output later when it runs.
  - --filesystem=xdg-data/boktai:create

modules:
  # SDL2 is runtime-required by the builder's window. It is fetched during the
  # download phase (network available), not the build phase (network disabled),
  # so static linking is not needed.
  - name: sdl2
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-arts
      - --disable-esd
      - --disable-nas
      - --disable-sndio
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
        sha256: 24b574f71c87a763f50704bbb630cbe38298d544a1f890f099a4696b1d6beba4
    cleanup:
      - /bin/sdl2-config
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/aclocal

  # The builder itself.
  - name: '@TARGET@'
    buildsystem: cmake-ninja
    builddir: true
    no-make-install: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Build ONLY the builder, no game target (which would need a ROM).
      # This is the gate that keeps this artifact ROM-free and publishable.
      - -DGBAGAME_BUILDER_ONLY=ON
      # The builder's window comes from recomp-ui. Launcher UI is on, but the
      # builder's own window draws with ImGui's built-in font (never loads
      # assets/), so a missing assets dir cannot stop a build.
      - -DGBAGAME_RECOMP_UI=ON
    sources:
      # Built from the working tree: sources are not in any git remote because
      # they are local to each game repo.
      - type: dir
        path: '@SOURCE_DIR@'
        # Generated by the packaging script: keeps copyrighted data (ROM, BIOS)
        # and build output out of the sandbox. post-install stages this filtered
        # tree as the builder's source payload.
@SKIP@
      # gba_recompile needs toml++, which CMake resolves with FetchContent.
      # Network is disabled during the Flatpak build phase, so FetchContent fails.
      # Declaring it as a source instead fetches it during the download phase
      # (where network is available). CMake skips FetchContent when the file
      # already exists, so one copy of the header is all that is needed.
      # Pinned to the engine's own commit, so there is no version drift.
      - type: file
        url: https://raw.githubusercontent.com/marzer/tomlplusplus/30172438cee64926dc41fdd9c11fb3ba5b2ba9de/toml.hpp
        sha256: 6b5172ad4dd6519aec67b919181fa7a38a2234131e5b2afa232dfe444819783e
        dest: gbarecomp/third_party/tomlpp
      # Desktop entry, icon and metainfo are generated beside the manifest by
      # the packaging script; post-install needs them. They are not in the source
      # tree, so they must be declared as sources to land in the build directory.
      - type: file
        path: '@SUPPORT_DIR@/@APP_ID@.desktop'
      - type: file
        path: '@SUPPORT_DIR@/@APP_ID@.png'
      - type: file
        path: '@SUPPORT_DIR@/@APP_ID@.metainfo.xml'
    post-install:
      # Install the builder executable to /app/bin. When the Flatpak app is
      # launched, this is what runs.
      - install -Dm755 '@TARGET@' '/app/bin/@TARGET@'
      # builddir keeps the pristine, filtered source at .. and CMake output in
      # this directory. Copy the actual source payload, not just a declaration
      # in the manifest; the builder resolves sources/ beside its executable.
      - |
        mkdir -p /app/bin/sources
        tar -C .. --exclude='./_flatpak_build' -cf - . | tar -C /app/bin/sources -xf -
      # gba_recompile has to be built EXPLICITLY. The game repo adds the
      # gbarecomp subdirectory with EXCLUDE_FROM_ALL, so the default target does
      # not cover it and the cmake-ninja buildsystem alone never produces it --
      # the post-install install(1) then failed with "cannot stat
      # 'gbarecomp/gba_recompile'". Building it here means the payload ships a
      # prebuilt recompiler, so a player's first build neither compiles the
      # compiler nor needs the network that its toml++ FetchContent would want.
      # The binary directory name is the GAME repo's choice of
      # add_subdirectory(<gbarecomp> <bindir>) -- BoktaiRecomp uses
      # "gbarecomp_build", not "gbarecomp", which is why a hardcoded path failed
      # here with "cannot stat 'gbarecomp/gba_recompile'". Locate it instead, so
      # this template stays game-agnostic.
      - cmake --build . --target gba_recompile
      - |
        recompiler="$(find . -type f -name gba_recompile -perm -u+x -print -quit)"
        test -n "$recompiler" || { echo "gba_recompile was built but not found" >&2; exit 1; }
        install -Dm755 "$recompiler" /app/bin/sources/bin/gba_recompile
      # These three are `type: file` sources, so flatpak-builder puts them in the
      # module's SOURCE directory. builddir:true means post-install runs one level
      # down in the build directory, so they are at '../' -- installing them by
      # bare name failed with "cannot stat 'tech.recomp.BoktaiBuilder.desktop'".
      #
      # Desktop entry (what Steam shows in the library and what the Deck lists
      # in its application grid).
      - install -Dm644 '../@APP_ID@.desktop' '/app/share/applications/@APP_ID@.desktop'
      # Icon (Steam and Deck launcher).
      - install -Dm644 '../@APP_ID@.png'
        '/app/share/icons/hicolor/256x256/apps/@APP_ID@.png'
      # AppData/metainfo (used by some package managers and app stores).
      - install -Dm644 '../@APP_ID@.metainfo.xml'
        '/app/share/metainfo/@APP_ID@.metainfo.xml'
